[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduled-report-bot"
version = "0.1.0"
description = "Generate scheduled sales summary reports from synthetic CSV data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
scheduled-report-bot = "scheduled_report_bot.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]
